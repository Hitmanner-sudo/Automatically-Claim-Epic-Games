name: Build and test

on:
  push:
    paths-ignore:
      - '**.md'
      - 'ci/egl-probe.ps1'
      - '.github/workflows/egl-probe.yml'
      - '.github/workflows/cef90.yml'
      - '.github/workflows/mem.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and browser tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet (Linux and Windows)
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          GOOS=windows go vet ./...
      - name: Test
        # The checkout driver is exercised in a real Chrome against a
        # stand-in for Epic's store.
        env:
          CHROMIUM_REQUIRED: '1'
        run: go test ./... -count=1 -race -timeout 20m

  windows:
    name: Build and try on Windows with the real launcher
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        env:
          CHROMIUM_REQUIRED: '1'
        run: go test ./... -count=1 -timeout 20m
      - name: Build
        shell: pwsh
        run: |
          $v = "0.1.$env:GITHUB_RUN_NUMBER"
          New-Item -ItemType Directory -Force dist | Out-Null
          # What the file says about itself to Windows (name, version,
          # manifest): made first, picked up by the linker.
          go run ./internal/winres/mkres -version $v -o cmd/epicautoclaim/rsrc_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { throw 'the resource object could not be made' }
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=$v" -o dist/EpicAutoClaim.exe ./cmd/epicautoclaim
          # Same program with a console, for the checks below.
          go build -trimpath -ldflags "-X main.version=$v" -o "$env:RUNNER_TEMP/eac-console.exe" ./cmd/epicautoclaim
          Get-Item dist/EpicAutoClaim.exe | Format-List Name, Length
          # Windows itself must be able to read it back.
          $vi = (Get-Item dist/EpicAutoClaim.exe).VersionInfo
          $vi | Format-List ProductName, FileDescription, CompanyName, FileVersion, ProductVersion, OriginalFilename, InternalName, LegalCopyright, Comments, Language
          if ($vi.ProductName -ne 'EpicAutoClaim' -or $vi.FileDescription -ne 'EpicAutoClaim' -or $vi.OriginalFilename -ne 'EpicAutoClaim.exe') { throw "Windows does not read the name of the program from it" }
          if ($vi.ProductVersion -ne $v -or $vi.FileVersion -ne "$v.0") { throw "Windows reads version $($vi.ProductVersion) / $($vi.FileVersion) from it, want $v" }
          if ($vi.LegalCopyright -notlike '*Not affiliated*') { throw 'the note that it is unofficial is missing' }
          # ...and to start it with the manifest it carries.
          $said = & "$env:RUNNER_TEMP/eac-console.exe" version
          if ($LASTEXITCODE -ne 0 -or "$said".Trim() -ne $v) { throw "the program did not start and say its version: '$said'" }
      - uses: actions/upload-artifact@v4
        with:
          name: EpicAutoClaim
          path: dist/EpicAutoClaim.exe
          if-no-files-found: error
      - name: Install the Epic Games Launcher
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $msi = "$env:RUNNER_TEMP\EpicInstaller.msi"
          Invoke-WebRequest -UseBasicParsing -Uri 'https://launcher-public-service-prod06.ol.epicgames.com/launcher/api/installer/download/EpicGamesLauncherInstaller.msi' -OutFile $msi
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -PassThru
          if (-not $p.WaitForExit(600000)) { throw 'installer timed out' }
          "msiexec exit code $($p.ExitCode)"
      - name: Free-games list
        shell: pwsh
        run: '& "$env:RUNNER_TEMP/eac-console.exe" check'
      - name: Hidden launcher trial (fresh install - the launcher wants to update itself)
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/eac-console.exe" doctor --launch
          if ($LASTEXITCODE -ne 0) { throw "doctor failed with $LASTEXITCODE" }
      - name: Hidden launcher trial (launcher up to date)
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/eac-console.exe" doctor --launch
          if ($LASTEXITCODE -ne 0) { throw "doctor failed with $LASTEXITCODE" }
      - name: One real round (launcher is not signed in here, so nothing can be claimed)
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/eac-console.exe" once
          if ($LASTEXITCODE -ne 0) { throw "once failed with $LASTEXITCODE" }
          & "$env:RUNNER_TEMP/eac-console.exe" status
      - name: Install (starts at sign-in, hourly task brings it back), measure it idle, uninstall
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\EpicAutoClaim\EpicAutoClaim.exe"
          # The checks below count processes and need the background process
          # to be idle. Two things could disturb that. The hourly task fires
          # on the full hour: wait that out rather than run across it.
          $n = Get-Date
          if ($n.Minute -ge 57) { Start-Sleep -Seconds ((60 - $n.Minute) * 60 - $n.Second + 5) }
          # And a look that the round before left due within minutes (it
          # does when Epic's list could not be read) would start a launcher.
          $due = (Get-Content "$env:LOCALAPPDATA\EpicAutoClaim\state.json" -Raw | ConvertFrom-Json).schedule.nextDue
          if ($due -and ([datetime]$due).ToUniversalTime() -lt (Get-Date).ToUniversalTime().AddMinutes(5)) { throw "the round before this step left a look due at $due; the checks below need an idle background process" }
          & "$env:RUNNER_TEMP/eac-console.exe" install
          if ($LASTEXITCODE -ne 0) { throw "install failed with $LASTEXITCODE" }
          if (-not (Test-Path $exe)) { throw 'the program was not copied to its folder' }
          "--- started at sign-in: the entry among Windows' start-up programs"
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).EpicAutoClaim
          $run
          if ($run -ne "`"$exe`" run --login") { throw "unexpected start-up entry: $run" }
          $task = (schtasks /Query /FO CSV | ConvertFrom-Csv | Where-Object { $_.TaskName -like '\EpicAutoClaim-*' } | Select-Object -First 1).TaskName
          if (-not $task) { throw 'the hourly task was not created' }
          "--- the task as Windows holds it"
          schtasks /Query /TN $task /XML
          $xml = [xml](schtasks /Query /TN $task /XML | Out-String)
          $s = $xml.Task.Settings
          if ($s.StartWhenAvailable -ne 'true' -or $s.DisallowStartIfOnBatteries -ne 'false' -or $s.StopIfGoingOnBatteries -ne 'false' -or $s.ExecutionTimeLimit -ne 'PT0S') { throw 'the task lost a setting' }
          if ($s.MultipleInstancesPolicy -ne 'IgnoreNew') { throw "the task would run copies side by side: $($s.MultipleInstancesPolicy)" }
          if (-not $xml.Task.Triggers.CalendarTrigger.ScheduleByDay) { throw 'the task has no trigger for every day' }
          if ($xml.Task.Triggers.CalendarTrigger.Repetition.Interval -ne 'PT1H') { throw 'the task is not started again every hour' }
          if ($s.Priority -ne '5') { throw "the task runs at priority $($s.Priority), not 5" }
          if ($xml.Task.RegistrationInfo.Version -notlike 'eac3-*') { throw "the task carries no marker: $($xml.Task.RegistrationInfo.Version)" }
          if ($xml.Task.Actions.Exec.Command -ne $exe -or $xml.Task.Actions.Exec.Arguments -ne 'run --scheduled') { throw "unexpected action: $($xml.Task.Actions.Exec.Command) $($xml.Task.Actions.Exec.Arguments)" }
          "--- status"
          & $exe status
          $bg = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'EpicAutoClaim.exe' -and $_.CommandLine -match ' run( |$)' })
          if ($bg.Count -ne 1) { throw "expected one background process after installing, found $($bg.Count)" }
          "--- what it costs while it waits (after half a minute of doing nothing)"
          Start-Sleep -Seconds 30
          Get-Process -Id $bg[0].ProcessId | Select-Object Id, @{n='WorkingSetMB';e={[math]::Round($_.WorkingSet64/1MB,1)}}, @{n='PrivateMB';e={[math]::Round($_.PrivateMemorySize64/1MB,1)}}, @{n='CPUseconds';e={[math]::Round($_.CPU,2)}}, PriorityClass, Threads | Format-List Id, WorkingSetMB, PrivateMB, CPUseconds, PriorityClass
          "--- a second copy (what the hourly task starts) ends at once and changes nothing"
          $p2 = Start-Process -FilePath $exe -ArgumentList 'run', '--scheduled' -PassThru
          if (-not $p2.WaitForExit(15000)) { throw 'a second copy stayed although one was running' }
          $bg2 = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'EpicAutoClaim.exe' -and $_.CommandLine -match ' run( |$)' })
          if ($bg2.Count -ne 1 -or $bg2[0].ProcessId -ne $bg[0].ProcessId) { throw 'the background process is not the one that was running' }
          "--- installing again (as after a change of settings) starts it afresh"
          & $exe install
          if ($LASTEXITCODE -ne 0) { throw "second install failed with $LASTEXITCODE" }
          Start-Sleep -Seconds 2
          $bg3 = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'EpicAutoClaim.exe' -and $_.CommandLine -match ' run( |$)' })
          if ($bg3.Count -ne 1 -or $bg3[0].ProcessId -eq $bg[0].ProcessId) { throw "installing again did not restart the background process ($($bg3.Count) running)" }
          "--- stop, then have the Task Scheduler bring it back"
          & $exe stop
          Start-Sleep -Seconds 2
          if (Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'EpicAutoClaim.exe' }) { throw 'still running after stop' }
          schtasks /Run /TN $task
          "schtasks /Run exit code $LASTEXITCODE"
          Start-Sleep -Seconds 6
          schtasks /Query /TN $task /V /FO LIST | Select-String -Pattern 'Last Run Time|Last Result|Next Run Time|Status|Logon Mode'
          & $exe status
          $bg4 = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'EpicAutoClaim.exe' -and $_.CommandLine -match ' run --scheduled' })
          if ($bg4.Count -ne 1) { throw "the Task Scheduler did not bring the program back ($($bg4.Count) running)" }
          "--- uninstall"
          & $exe uninstall
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed with $LASTEXITCODE" }
          schtasks /Query /TN $task 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'the task is still there after uninstall' }
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).EpicAutoClaim) { throw 'the start-up entry is still there after uninstall' }
          Start-Sleep -Seconds 2
          $left = Get-CimInstance Win32_Process | Where-Object { $_.Name -in 'EpicAutoClaim.exe' }
          if ($left) { $left | Select-Object ProcessId, CommandLine | Format-List; throw 'the background process is still running after uninstall' }
          exit 0
      - name: Nothing left running
        if: always()
        shell: pwsh
        run: |
          Start-Sleep -Seconds 3
          $left = Get-CimInstance Win32_Process | Where-Object { $_.Name -in 'EpicGamesLauncher.exe', 'EpicWebHelper.exe' }
          $left | Select-Object ProcessId, Name, CommandLine | Format-List
          if ($left) { throw "launcher processes were left behind" }
      - name: Program log
        if: always()
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\EpicAutoClaim\logs\EpicAutoClaim.log"
          if (Test-Path $log) { Get-Content $log } else { 'no log file' }
          Get-ChildItem "$env:LOCALAPPDATA\EpicAutoClaim" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
