name: Build and test

on:
  push:
    paths-ignore:
      - '**.md'
      - 'ci/egl-probe.ps1'
      - '.github/workflows/egl-probe.yml'
      - '.github/workflows/cef90.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and browser tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet (Linux and Windows)
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          GOOS=windows go vet ./...
      - name: Test
        # The checkout driver is exercised in a real Chrome against a
        # stand-in for Epic's store.
        env:
          CHROMIUM_REQUIRED: '1'
        run: go test ./... -count=1 -race -timeout 20m

  windows:
    name: Build and try on Windows with the real launcher
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        env:
          CHROMIUM_REQUIRED: '1'
        run: go test ./... -count=1 -timeout 20m
      - name: Build
        shell: pwsh
        run: |
          $v = "0.1.$env:GITHUB_RUN_NUMBER"
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=$v" -o dist/EpicAutoClaim.exe ./cmd/epicautoclaim
          # Same program with a console, for the checks below.
          go build -trimpath -ldflags "-X main.version=$v" -o "$env:RUNNER_TEMP/eac-console.exe" ./cmd/epicautoclaim
          Get-Item dist/EpicAutoClaim.exe | Format-List Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: EpicAutoClaim
          path: dist/EpicAutoClaim.exe
          if-no-files-found: error
      - name: Install the Epic Games Launcher
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $msi = "$env:RUNNER_TEMP\EpicInstaller.msi"
          Invoke-WebRequest -UseBasicParsing -Uri 'https://launcher-public-service-prod06.ol.epicgames.com/launcher/api/installer/download/EpicGamesLauncherInstaller.msi' -OutFile $msi
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -PassThru
          if (-not $p.WaitForExit(600000)) { throw 'installer timed out' }
          "msiexec exit code $($p.ExitCode)"
      - name: Free-games list
        shell: pwsh
        run: '& "$env:RUNNER_TEMP/eac-console.exe" check'
      - name: Hidden launcher trial (fresh install - the launcher wants to update itself)
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/eac-console.exe" doctor --launch
          if ($LASTEXITCODE -ne 0) { throw "doctor failed with $LASTEXITCODE" }
      - name: Hidden launcher trial (launcher up to date)
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/eac-console.exe" doctor --launch
          if ($LASTEXITCODE -ne 0) { throw "doctor failed with $LASTEXITCODE" }
      - name: One real round (launcher is not signed in here, so nothing can be claimed)
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/eac-console.exe" once
          if ($LASTEXITCODE -ne 0) { throw "once failed with $LASTEXITCODE" }
          & "$env:RUNNER_TEMP/eac-console.exe" status
      - name: Install as a daily Windows task, start it through the Task Scheduler, uninstall
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\EpicAutoClaim\EpicAutoClaim.exe"
          & "$env:RUNNER_TEMP/eac-console.exe" install
          if ($LASTEXITCODE -ne 0) { throw "install failed with $LASTEXITCODE" }
          if (-not (Test-Path $exe)) { throw 'the program was not copied to its folder' }
          $task = (schtasks /Query /FO CSV | ConvertFrom-Csv | Where-Object { $_.TaskName -like '\EpicAutoClaim-*' } | Select-Object -First 1).TaskName
          if (-not $task) { throw 'the daily task was not created' }
          "--- the task as Windows holds it"
          schtasks /Query /TN $task /XML
          $xml = [xml](schtasks /Query /TN $task /XML | Out-String)
          $s = $xml.Task.Settings
          if ($s.StartWhenAvailable -ne 'true' -or $s.DisallowStartIfOnBatteries -ne 'false' -or $s.StopIfGoingOnBatteries -ne 'false' -or $s.ExecutionTimeLimit -ne 'PT0S') { throw 'the task lost a setting on the way in' }
          if (-not $xml.Task.Triggers.CalendarTrigger.ScheduleByDay) { throw 'the task has no daily trigger' }
          if ($xml.Task.Triggers.CalendarTrigger.Repetition.Interval -ne 'PT1H') { throw 'the task is not started again every hour' }
          if ($s.Priority -ne '5') { throw "the task runs at priority $($s.Priority), not 5" }
          if ($xml.Task.RegistrationInfo.Version -notlike 'eac*') { throw "the task carries no marker: $($xml.Task.RegistrationInfo.Version)" }
          if ($xml.Task.Actions.Exec.Command -ne $exe -or $xml.Task.Actions.Exec.Arguments -ne 'run --scheduled') { throw "unexpected action: $($xml.Task.Actions.Exec.Command) $($xml.Task.Actions.Exec.Arguments)" }
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue
          if ($run.EpicAutoClaim) { throw 'a start-up entry was written although the daily task exists' }
          "--- status"
          & $exe status
          "--- stop, then have the Task Scheduler start it"
          & $exe stop
          Start-Sleep -Seconds 2
          schtasks /Run /TN $task
          "schtasks /Run exit code $LASTEXITCODE"
          Start-Sleep -Seconds 6
          schtasks /Query /TN $task /V /FO LIST | Select-String -Pattern 'Last Run Time|Last Result|Next Run Time|Status|Logon Mode'
          & $exe status
          "--- uninstall"
          & $exe uninstall
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed with $LASTEXITCODE" }
          schtasks /Query /TN $task 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'the daily task is still there after uninstall' }
          Start-Sleep -Seconds 2
          $left = Get-CimInstance Win32_Process | Where-Object { $_.Name -in 'EpicAutoClaim.exe' }
          if ($left) { $left | Select-Object ProcessId, CommandLine | Format-List; throw 'the background process is still running after uninstall' }
          exit 0
      - name: Nothing left running
        if: always()
        shell: pwsh
        run: |
          Start-Sleep -Seconds 3
          $left = Get-CimInstance Win32_Process | Where-Object { $_.Name -in 'EpicGamesLauncher.exe', 'EpicWebHelper.exe' }
          $left | Select-Object ProcessId, Name, CommandLine | Format-List
          if ($left) { throw "launcher processes were left behind" }
      - name: Program log
        if: always()
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\EpicAutoClaim\logs\EpicAutoClaim.log"
          if (Test-Path $log) { Get-Content $log } else { 'no log file' }
          Get-ChildItem "$env:LOCALAPPDATA\EpicAutoClaim" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
