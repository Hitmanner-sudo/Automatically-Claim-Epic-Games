name: Memory of the background process

# Measures what the background process holds in memory while it looks at
# the free-games list, and what it holds while it waits, in several
# settings. Started by hand. It uses the "memdiag" build (never released),
# which takes its tuning from the environment and writes memory figures
# into its log at marked moments (cmd/epicautoclaim/memdiag_windows.go).
#
# The launcher is not installed here, so a look is: download the list, see
# what is free, find no launcher, go back to waiting. That is what an
# hourly look costs on a PC where everything free has been claimed already.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: Measure
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build (memdiag)
        shell: pwsh
        run: |
          go build -tags memdiag -trimpath -ldflags "-H=windowsgui -s -w -X main.version=memdiag" -o mem/EpicAutoClaim.exe ./cmd/epicautoclaim
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          "processors here: $([Environment]::ProcessorCount)"
      - name: Measure
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'mem\EpicAutoClaim.exe'
          $data = Join-Path $env:LOCALAPPDATA 'EpicAutoClaim'
          $log = Join-Path $data 'logs\EpicAutoClaim.log'
          $knobs = 'EAC_PROCS', 'EAC_GC', 'EAC_LIMIT_MB', 'EAC_CLAIM_GC', 'EAC_WSCAP_KB', 'EAC_TRIM'
          $variants = @(
            @{ name = 'A: as released';                 env = @{} },
            @{ name = 'B: capped at 16 MB';             env = @{ EAC_WSCAP_KB = '16384' } },
            @{ name = 'C: capped at 14 MB';             env = @{ EAC_WSCAP_KB = '14336' } },
            @{ name = 'D: capped at 12 MB';             env = @{ EAC_WSCAP_KB = '12288' } },
            @{ name = 'E: capped at 11 MB';             env = @{ EAC_WSCAP_KB = '11264' } },
            @{ name = 'F: capped at 10 MB';             env = @{ EAC_WSCAP_KB = '10240' } },
            @{ name = 'G: capped at 9 MB';              env = @{ EAC_WSCAP_KB = '9216' } },
            @{ name = 'H: handed back at the stages of the download'; env = @{ EAC_TRIM = '1' } },
            @{ name = 'I: handed back at the stages, capped at 12 MB'; env = @{ EAC_TRIM = '1'; EAC_WSCAP_KB = '12288' } },
            @{ name = 'J: capped at 12 MB, again';      env = @{ EAC_WSCAP_KB = '12288' } }
          )
          $table = @()
          foreach ($v in $variants) {
            Remove-Item $data -Recurse -Force -ErrorAction SilentlyContinue
            foreach ($k in $knobs) { Remove-Item "Env:$k" -ErrorAction SilentlyContinue }
            foreach ($k in $v.env.Keys) { Set-Item "Env:$k" $v.env[$k] }
            $p = Start-Process -FilePath $exe -ArgumentList 'run' -PassThru
            $maxWs = 0; $maxCommit = 0
            # (Started within two minutes of this machine's sign-in, the
            # program first waits those out, as it does on a PC. A look is
            # over when it has said when it will look next and has gone
            # back to waiting after that.)
            $deadline = (Get-Date).AddSeconds(240)
            while ((Get-Date) -lt $deadline) {
              $p.Refresh()
              if ($p.HasExited) { break }
              $maxWs = [math]::Max($maxWs, $p.WorkingSet64)
              $maxCommit = [math]::Max($maxCommit, $p.PrivateMemorySize64)
              if (Test-Path $log) {
                $lines = @(Get-Content $log)
                $said = -1
                for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match ' next check ') { $said = $i } }
                $over = $false
                if ($said -ge 0) { for ($i = $said + 1; $i -lt $lines.Count; $i++) { if ($lines[$i] -match ' mem asleep ') { $over = $true } } }
                if ($over) { break }
              }
              Start-Sleep -Milliseconds 60
            }
            Start-Sleep -Seconds 4
            $p.Refresh()
            $asleepWs = if ($p.HasExited) { -1 } else { $p.WorkingSet64 }
            $asleepPrivate = -1
            $raw = Get-CimInstance Win32_PerfRawData_PerfProc_Process -Filter "IDProcess=$($p.Id)" -ErrorAction SilentlyContinue
            if ($raw) { $asleepPrivate = $raw.WorkingSetPrivate }
            ''
            "===== $($v.name)"
            if (Test-Path $log) { Get-Content $log } else { 'no log was written' }
            $end = if (Test-Path $log) { Select-String -Path $log -Pattern 'mem end of look\s+t=(\d+)ms faults=(\d+) cap=\S+ ws=(\S+) privateWS=(\S+) peakWS=(\S+) commit=(\S+) \| go: mapped=(\S+)' | Select-Object -Last 1 } else { $null }
            $row = [ordered]@{ variant = $v.name }
            if ($end) {
              $g = $end.Matches[0].Groups
              $row['end of look: private WS'] = $g[4].Value
              $row['WS'] = $g[3].Value
              $row['peak WS'] = $g[5].Value
              $row['commit'] = $g[6].Value
              $row['Go mapped'] = $g[7].Value
              $row['ms since start'] = $g[1].Value
              $row['page faults'] = $g[2].Value
            }
            $row['sampled max WS'] = '{0:N1}' -f ($maxWs / 1MB)
            $row['asleep WS'] = '{0:N1}' -f ($asleepWs / 1MB)
            $row['asleep private WS'] = '{0:N1}' -f ($asleepPrivate / 1MB)
            $table += [pscustomobject]$row
            Start-Process -FilePath $exe -ArgumentList 'stop' -Wait
            if (-not $p.WaitForExit(20000)) { Stop-Process -Id $p.Id -Force; 'the process had to be ended' }
          }
          ''
          '===== Summary (MB)'
          foreach ($r in $table) { ($r.PSObject.Properties | ForEach-Object { "$($_.Name)=$($_.Value)" }) -join ' | ' }
