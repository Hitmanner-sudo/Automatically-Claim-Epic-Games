name: Launcher probe (Windows)

# An investigation tool, run by hand: installs a real Epic Games Launcher on
# a Windows runner and reports how it behaves (hidden start, DevTools
# endpoint, self-update, windows). No account is signed in.

on:
  workflow_dispatch:
    inputs:
      test:
        description: Which scenario to run
        type: choice
        default: desktop
        options: [silent, desktop, plain, preview]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Probe the launcher (${{ inputs.test }})
        shell: pwsh
        run: ./ci/egl-probe.ps1 -Test ${{ inputs.test }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egl-probe-${{ inputs.test }}
          path: ${{ runner.temp }}/egl-probe/*.log
          if-no-files-found: ignore
