name: Release

# Builds EpicAutoClaim.exe and publishes it as a GitHub release.
# Run it by hand with a version such as v1.0.0, or push a tag named v*.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v1.0.0
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./... -count=1
      - name: Build
        shell: pwsh
        run: |
          $tag = '${{ inputs.version }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "version must look like v1.2.3, got '$tag'" }
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=$($tag.Substring(1))" -o EpicAutoClaim.exe ./cmd/epicautoclaim
          (Get-FileHash EpicAutoClaim.exe -Algorithm SHA256).Hash + '  EpicAutoClaim.exe' | Out-File -Encoding ascii EpicAutoClaim.exe.sha256
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            EpicAutoClaim.exe
            EpicAutoClaim.exe.sha256
