name: Release

# Builds EpicAutoClaim.exe and publishes it as a GitHub release.
# Run it by hand with a version such as v1.0.0, or push a tag named v*.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v1.0.0
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./... -count=1
      - name: Build
        shell: pwsh
        run: |
          $tag = '${{ inputs.version }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "version must look like v1.2.3, got '$tag'" }
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=$($tag.Substring(1))" -o EpicAutoClaim.exe ./cmd/epicautoclaim
          $hash = (Get-FileHash EpicAutoClaim.exe -Algorithm SHA256).Hash
          $size = [math]::Round((Get-Item EpicAutoClaim.exe).Length / 1MB, 1)
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          @"
          **One file: ``EpicAutoClaim.exe`` ($size MB).** Download it and double-click it. That installs it (one dialog, the only window it ever shows). From then on it starts by itself when you sign in to Windows, looks at Epic's free-games list every hour, and claims each free game through your own Epic Games Launcher without showing anything.

          Before the first run: the Epic Games Launcher must be installed and signed in with **Remember me** ticked.

          To remove it: ``EpicAutoClaim.exe uninstall``.

          Things to know:

          - The file is not code-signed. Windows may ask before running it (**More info → Run anyway**). Where **Smart App Control** is switched on, Windows decides by itself whether an unsigned program may start and offers no "run anyway"; if it refuses this file, nothing is installed and nothing is broken. See the README.
          - The order safeguards in this version are stricter than in the build that made the first real claims (0.1.18). They pass every test, including a run inside the launcher's own built-in browser, but this exact build has not yet met Epic's real checkout. ``EpicAutoClaim.exe once --dry-run`` rehearses everything except the order.

          SHA-256 of ``EpicAutoClaim.exe``: ``$hash``
          "@ -replace '(?m)^          ', '' | Out-File -Encoding utf8 release-notes.md
          Get-Content release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: EpicAutoClaim ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: EpicAutoClaim.exe
          fail_on_unmatched_files: true
